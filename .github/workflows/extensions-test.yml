name: Extensions Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: 3.23.4

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  c-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libsql-sqlite3
    name: CR SQLite C Tests
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib

    steps:
      - uses: hecrj/setup-rust-action@v2
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install deps
        run: sudo apt update && sudo apt install -y libclang-18-dev
      - name: build libsql
        run: |
          ./configure
          make libsql
      - name: build
        run: |
          cd ext/crr
          make loadable
      - name: test
        run: |
          cd ext/crr
          make test

  rs-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libsql-sqlite3
    name: CR SQLite Rust Tests
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib

    steps:
      - uses: hecrj/setup-rust-action@v2
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install deps
        run: sudo apt update && sudo apt install -y libclang-18-dev
      - name: build libsql
        run: |
          ./configure
          make libsql
      - name: test
        run: |
          cd ext/crr/rs/core
          cargo test --features=loadable_extension

  extensions-tests:
    runs-on: ubuntu-latest
    name: Extensions Tests
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      # wabt-sys v0.6.1 bundles a CMakeLists that declares a pre-3.5
      # cmake_minimum_required, which CMake 4.x refuses; allow it.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - uses: hecrj/setup-rust-action@v2
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: install libs
        run: |
          sudo apt update && sudo apt install -y libclang-18-dev libblas-dev liblapack-dev
      - name: build libsql and ffi bindings
        run: |
          cargo xtask build-bundled
      - name: download extensions
        run: |
          cd libsql-sqlite3/test/rust_suite
          export VSS_VERSION="v0.1.2"
          wget https://github.com/asg017/sqlite-vss/releases/download/$VSS_VERSION/sqlite-vss-$VSS_VERSION-loadable-linux-x86_64.tar.gz
          tar -xvf sqlite-vss-$VSS_VERSION-loadable-linux-x86_64.tar.gz -C src
      - name: test
        run: |
          cd libsql-sqlite3/test/rust_suite
          # Only execute extensions tests
          cargo test --features=extensions extensions
